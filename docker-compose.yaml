# Coolify: deploy this repository as a "Docker Compose" resource.
# All settings below appear as editable environment variables in Coolify.
services:
  mailproxy:
    build: .
    restart: unless-stopped
    environment:
      # Customer domains (comma separated). a.com -> mail.a.com, autoconfig.a.com, autodiscover.a.com
      - MAIL_DOMAINS=${MAIL_DOMAINS:?set MAIL_DOMAINS}
      - MAIL_HOST_PREFIX=${MAIL_HOST_PREFIX:-mail}
      # Implicit-TLS endpoints of the mail provider: host[:port] (ports default to 993/995/465).
      # Leave a protocol empty to disable it.
      - UPSTREAM_IMAP=${UPSTREAM_IMAP:-}
      - UPSTREAM_POP3=${UPSTREAM_POP3:-}
      - UPSTREAM_SMTP=${UPSTREAM_SMTP:-}
      # Also accept unencrypted/STARTTLS clients on 143, 110 and 587.
      - ENABLE_PLAINTEXT=${ENABLE_PLAINTEXT:-true}
      # Also accept SMTP submission (plain/STARTTLS) on port 25, for clients that default to it.
      # Do not enable while this host is listed as an MX for a served domain (see docs).
      - ENABLE_PORT_25=${ENABLE_PORT_25:-false}
      # Advanced: explicit listener list "listenPort:kind[:upstreamHost:upstreamPort],..."
      - LISTENERS=${LISTENERS:-}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL}
      - ACME_STAGING=${ACME_STAGING:-false}
      - CF_API_TOKEN=${CF_API_TOKEN:?set CF_API_TOKEN}
      - CF_ZONE_TOKEN=${CF_ZONE_TOKEN:-}
      # Only for customer zones that are NOT in your Cloudflare account (see README)
      - ACME_DELEGATION_ZONE=${ACME_DELEGATION_ZONE:-}
      - ACME_DELEGATED_DOMAINS=${ACME_DELEGATED_DOMAINS:-}
      - DISPLAY_NAME=${DISPLAY_NAME:-}
      - REDIRECTS=${REDIRECTS:-}
      - MAX_CONNS_PER_IP=${MAX_CONNS_PER_IP:-20}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-35m}
      # Login protection (see docs/security.md). Manual allow/deny entries go
      # into the access.conf file below (Coolify: Persistent Storage tab).
      - LOGIN_GUARD=${LOGIN_GUARD:-true}
      - BAN_FREE_FAILURES=${BAN_FREE_FAILURES:-2}
      - BAN_STEPS=${BAN_STEPS:-30s,5m,1h,24h,7d}
      - BAN_RESET_AFTER=${BAN_RESET_AFTER:-24h}
      - WHITELIST_DURATION=${WHITELIST_DURATION:-30d}
      - WHITELIST_MAX_FAILURES=${WHITELIST_MAX_FAILURES:-10}
      - CONN_RATE_LIMIT=${CONN_RATE_LIMIT:-15}
      - REQUIRE_KNOWN_DOMAIN=${REQUIRE_KNOWN_DOMAIN:-true}
      - ALLOW_PLAINTEXT_AUTH=${ALLOW_PLAINTEXT_AUTH:-false}
    ports:
      # Remove the ports of protocols you do not use.
      - "993:993"   # IMAPS
      - "143:143"   # IMAP (plain / STARTTLS)
      - "995:995"   # POP3S
      - "110:110"   # POP3 (plain / STLS)
      - "465:465"   # SMTPS submission
      - "587:587"   # Submission (plain / STARTTLS)
      - "25:25"     # Submission on port 25, only used with ENABLE_PORT_25=true
    volumes:
      - mailproxy-data:/data
      # Manually maintained allow/deny list, editable in Coolify under
      # Persistent Storage. Reloaded automatically within ~10 seconds.
      - type: bind
        source: ./access.conf
        target: /config/access.conf
        read_only: true
        content: |
          # Mail proxy access list. One entry per line, '#' starts a comment.
          # Changes are picked up automatically within about 10 seconds.
          #
          #   allow 203.0.113.7       IP is never banned or rate limited (also lifts an automatic ban)
          #   allow 198.51.100.0/24   same for a whole network (IPv4 or IPv6 CIDR)
          #   deny  192.0.2.0/24      connections are refused
          #   allow alice@a.com       mailbox is never locked by mailbox-based bans
          #   deny  bob@a.com         logins for this mailbox are refused
          #
          # A deny entry wins over a matching allow entry.
          # Automatic bans and the 30-day whitelist are in /data/access-state.json.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    healthcheck:
      test: ["CMD", "/mailproxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      # Route every autoconfig.* / autodiscover.* host to this container.
      # The app itself answers only for domains listed in MAIL_DOMAINS.
      - traefik.enable=true
      - traefik.http.services.mailproxy-autoconfig.loadbalancer.server.port=8080
      - traefik.http.routers.mailproxy-autoconfig-http.rule=HostRegexp(`^(autoconfig|autodiscover)\..+$$`)
      - traefik.http.routers.mailproxy-autoconfig-http.entrypoints=http
      - traefik.http.routers.mailproxy-autoconfig-http.service=mailproxy-autoconfig
      - traefik.http.routers.mailproxy-autoconfig-http.priority=1
      - traefik.http.routers.mailproxy-autoconfig-https.rule=HostRegexp(`^(autoconfig|autodiscover)\..+$$`)
      - traefik.http.routers.mailproxy-autoconfig-https.entrypoints=https
      - traefik.http.routers.mailproxy-autoconfig-https.service=mailproxy-autoconfig
      - traefik.http.routers.mailproxy-autoconfig-https.tls=true
      - traefik.http.routers.mailproxy-autoconfig-https.priority=1
      # Redirect hosts (REDIRECTS) are NOT routed by labels here: Coolify escapes
      # "$" in labels, so a ${VAR} in a Host() rule would never be substituted.
      # Instead set the hosts as the "mailproxy" service domains in Coolify, with
      # port 8080, e.g. https://webmail.a.com:8080 (see docs/configuration.md).

volumes:
  mailproxy-data:
